[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pbo"
description = "Kubernetes power-budget operator for multi-service LLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Karthik Mattu", email = "km5503@rit.edu" }]
dynamic = ["version"]
# The curve loader is stdlib-only on purpose. Runtime dependencies for the
# operator, mock pod and emulator are added in the phase that needs them.
dependencies = []

[project.optional-dependencies]
# serve: the Phase 1 mock serving pod, power emulator and load generator.
serve = ["aiohttp>=3.9", "prometheus_client>=0.20"]
# operator: the Phase 2 kopf operator and its Kubernetes client.
operator = ["kopf>=1.37", "kubernetes>=29"]
# dev pulls in serve and operator so CI type-checks and tests them too.
dev = ["pbo[serve,operator]", "pytest>=8", "ruff>=0.6", "mypy>=1.10"]
study = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.7"]

[project.scripts]
pbo-mockserve = "pbo.mockserve.server:main"
pbo-emulator = "pbo.emulator.server:main"
pbo-loadgen = "pbo.loadgen.main:main"
pbo-operator = "pbo.operator.main:main"
pbo-admission = "pbo.admission.proxy:main"

[tool.hatch.version]
path = "src/pbo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pbo"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["studies"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# The official Kubernetes client ships no type hints.
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
